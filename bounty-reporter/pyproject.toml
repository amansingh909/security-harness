[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-reporter"
version = "0.1.0"
description = "Turn structured findings into HackerOne / Bugcrowd reports with correct CVSS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
enrich = ["httpx>=0.27"]   # only needed for cve-index enrichment
dev = ["pytest>=8.0"]

[project.scripts]
bounty-reporter = "bounty_reporter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
